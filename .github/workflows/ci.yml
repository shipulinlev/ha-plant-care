name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run catches breakage from new HA / HACS validator releases.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: |
          scripts/setup
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Same entry point as in the dev container: ruff, ruff format, mypy, pytest.
      - name: Run checks
        run: scripts/test

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand assets are not published yet (see PLAN.md, phase 6).
          ignore: brands
